name: Build CLI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      hardware_tag:
        description: Hardware version to pair with this CLI
        required: true
        default: v0.1.11
      hardware_repository:
        description: Repository providing the paired hardware release or workflow artifact
        required: true
        default: OrchardLinux/hardware
      hardware_run_id:
        description: Optional hardware workflow run providing the tested wheel before its first release
        required: false
      reuse_cli_run_id:
        description: Exact prior run supplying the unchanged CLI distribution
        required: false
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      HARDWARE_REPOSITORY: ${{ inputs.hardware_repository || 'OrchardLinux/hardware' }}
      HARDWARE_TAG: ${{ inputs.hardware_tag || 'v0.1.11' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the reviewed PR hardware dependency
        if: github.event_name == 'pull_request'
        id: hardware-test
        run: |
          python - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path('ci/hardware-test.json').read_text())
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', pin['repository'])
          assert re.fullmatch(r'[0-9a-f]{40}', pin['ref'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + pin['repository'] + '\nref=' + pin['ref'] + '\n')
          PYTHON
      - name: Check out the exact hardware candidate for PR tests
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.hardware-test.outputs.repository }}
          ref: ${{ steps.hardware-test.outputs.ref }}
          path: out/hardware-source
          persist-credentials: false
      - name: Build the pinned hardware candidate wheel
        if: github.event_name == 'pull_request'
        env:
          HARDWARE_REF: ${{ steps.hardware-test.outputs.ref }}
        run: |
          test "$(git -C out/hardware-source rev-parse HEAD)" = "$HARDWARE_REF"
          python -m pip install build
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/out/hardware" out/hardware-source
      - name: Download pinned released hardware dependency
        if: github.event_name != 'pull_request' && inputs.hardware_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$HARDWARE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$HARDWARE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p out/hardware
          gh release download "$HARDWARE_TAG" --repo "$HARDWARE_REPOSITORY" \
            --pattern '*.whl' --pattern SHA256SUMS --dir out/hardware
          (cd out/hardware && sha256sum --check --ignore-missing SHA256SUMS)
      - name: Reuse the already-built hardware wheel during first-release bring-up
        if: github.event_name != 'pull_request' && inputs.hardware_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: hardware-packages
          path: out/hardware
          repository: ${{ env.HARDWARE_REPOSITORY }}
          run-id: ${{ inputs.hardware_run_id }}
          github-token: ${{ github.token }}
      - name: Reuse the unchanged CLI distribution
        if: inputs.reuse_cli_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: cli-wheel-pair
          path: out/reused
          run-id: ${{ inputs.reuse_cli_run_id }}
          github-token: ${{ github.token }}
      - name: Stage the reused CLI distribution
        if: inputs.reuse_cli_run_id != ''
        run: mkdir -p dist && cp out/reused/orchard_cli-*.whl out/reused/orchard_cli-*.tar.gz dist/
      - name: Build the CLI distribution once
        if: inputs.reuse_cli_run_id == ''
        run: python -m pip install build && python -m build
      - name: Verify the exact wheel pair
        run: |
          python -m pip install dist/*.whl out/hardware/*.whl
          python -m pip check
          python -c 'import os, importlib.metadata as m; assert os.environ["HARDWARE_TAG"] == "v" + m.version("orchard-hardware")'
          mkdir -p out/pair
          cp dist/*.whl dist/*.tar.gz out/hardware/*.whl out/pair/
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then cp ci/hardware-test.json out/pair/; fi
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python -c 'import os, importlib.metadata as m; assert os.environ["TAG"] == "v" + m.version("orchard-cli")'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-wheel-pair
          path: out/pair/*
          if-no-files-found: error
          retention-days: 2
  test:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: cli-wheel-pair
          path: out/pair
      - run: python -m pip install out/pair/*.whl && python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install mypy==1.18.2 && python -m mypy
  assets:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-wheel-pair
          path: out/pair
      - name: Stage release requirements without rebuilding
        run: |
          python tools/prepare_release.py --cli-wheel out/pair/orchard_cli-*.whl \
            --hardware-wheel out/pair/orchard_hardware-*.whl --output out/stage
          mkdir -p out/publication
          cp out/stage/cli/* out/pair/orchard_cli-*.tar.gz out/publication/
          (cd out/publication && sha256sum ./* > ../SHA256SUMS && mv ../SHA256SUMS .)
      - name: Attest public build
        if: toJSON(github.event.repository.private) == 'false'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/publication/*
      - name: Include public attestation bundle
        if: toJSON(github.event.repository.private) == 'false'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "out/publication/cli-build.sigstore.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets
          path: out/publication/*
          if-no-files-found: error
          retention-days: 2
  draft:
    if: github.ref_type == 'tag'
    needs: assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-assets
          path: assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* --draft --verify-tag --title "$TAG" \
            --notes 'Compatible CLI/hardware wheels and hashed installer requirements. Review before publication.'
